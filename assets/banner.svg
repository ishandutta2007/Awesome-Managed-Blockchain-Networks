<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{r:4px;opacity:.4}50%{r:9px;opacity:1}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.title{font-weight:800;font-size:52px;fill:#fff}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8;letter-spacing:1px}.badge-text{font-weight:600;font-size:14px;fill:#00f2fe}.node-pulse{animation:pulse 3s infinite ease-in-out}.node-pulse-delayed{animation:pulse 3s infinite ease-in-out 1.5s}.flow-line{stroke-dasharray:8,8;animation:dash 20s linear infinite}.floating-card{animation:float 5s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#4facfe" stroke-width="1" opacity=".12"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><g fill="none" stroke="url(#p