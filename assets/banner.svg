<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#f5576c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; letter-spacing: 1px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #00f2fe; }
    
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 9px; opacity: 1; }
      100% { r: 4px; opacity: 0.4; }
    }
    
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .node-pulse { animation: pulse 3s infinite ease-in-out; }
    .node-pulse-delayed { animation: pulse 3s infinite ease-in-out 1.5s; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash 20s linear infinite; }
    .floating-card { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Network Grid Grid Lines (Dynamic Dynamic Layer in Background) -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Animated Blockchain Network Topology Lines -->
  <g stroke="url(#primaryGlow)" stroke-width="2" fill="none" opacity="0.45" class="flow-line">
    <path d="M 100,100 L 250,220 L 450,150 L 650,280 L 850,180 L 1100,300" />
    <path d="M 150,320 L 350,120 L 550,250 L 750,110 L 980,240" />
  </g>

  <!-- Node Pulsing Graph Vertices -->
  <g fill="#00f2fe">
    <circle cx="250" cy="220" class="node-pulse" filter="url(#glow)" />
    <circle cx="450" cy="150" class="node-pulse-delayed" filter="url(#glow)" />
    <circle cx="650" cy="280" class="node-pulse" filter="url(#glow)" />
    <circle cx="850" cy="180" class="node-pulse-delayed" filter="url(#glow)" />
    <circle cx="350" cy="120" class="node-pulse" filter="url(#glow)" />
    <circle cx="750" cy="110" class="node-pulse-delayed" filter="url(#glow)" />
  </g>

  <!-- Background Floating Decorative Block Hexagons -->
  <g class="floating-card" opacity="0.25">
    <polygon points="1050,80 1090,100 1090,140 1050,160 1010,140 1010,100" fill="none" stroke="#f093fb" stroke-width="2" />
    <polygon points="120,260 150,275 150,305 120,320 90,305 90,275" fill="none" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- Foreground Content Container (Ensures Text remains crisp & visible) -->
  <!-- Tag Pill -->
  <rect x="80" y="75" width="320" height="36" rx="18" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" opacity="0.9" />
  <text x="100" y="98" class="badge-text">⚡ ENTERPRISE &amp; WEB3 INFRASTRUCTURE</text>

  <!-- Main Title -->
  <text x="80" y="175" class="title" filter="url(#glow)">Awesome Managed Blockchain Networks</text>

  <!-- Subtitle -->
  <text x="80" y="225" class="subtitle">Curated directory of SaaS RPC providers, Node infrastructure &amp; Open-Source clients</text>

  <!-- Feature Metric Pills -->
  <g transform="translate(80, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="31" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#4facfe">☁️ SaaS Providers</text>
    
    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="260" y="31" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#00f2fe">🔓 Open-Source Clients</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="500" y="31" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#f093fb">🌐 Multi-Chain RPC</text>
  </g>
</svg>
